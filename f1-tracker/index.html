<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>tr('F1 Tracker')</title>
    <link rel="icon" href="resources/icon.svg" type="image/svg+xml" />
    <link rel="stylesheet" href="styles/main.css" />

    <!-- iCUE controls (settings panel) -->
    <meta name="x-icue-property" content="startView"
          data-label="tr('Start view')" data-type="tab-buttons"
          data-default="'race'"
          data-values="[{'key':'race','value':'Race'},{'key':'drivers','value':'Drivers'},{'key':'teams','value':'Teams'}]" />

    <meta name="x-icue-property" content="showPictures"
          data-label="tr('Show pictures')" data-type="switch" data-default="true" />

    <meta name="x-icue-property" content="autoRotate"
          data-label="tr('Rotate views automatically')" data-type="switch" data-default="false" />

    <meta name="x-icue-property" content="rotateSeconds"
          data-label="tr('Seconds per view')" data-type="slider"
          data-default="15" data-min="5" data-max="60" data-step="5" data-unit-label="'s'" />

    <meta name="x-icue-property" content="textColor"
          data-label="tr('Text color')" data-type="color" data-default="'#FFFFFF'" />

    <meta name="x-icue-property" content="accentColor"
          data-label="tr('Accent color')" data-type="color" data-default="'#e10600'" />

    <script type="application/json" id="x-icue-groups">
    [
        { "title": "tr('Display')", "properties": ["startView", "showPictures", "autoRotate", "rotateSeconds"] },
        { "title": "tr('Appearance')", "properties": ["textColor", "accentColor"] }
    ]
    </script>

</head>
<body>

<header>
    <div class="logo">F1 <span>Tracker</span></div>
    <nav class="tabs" aria-label="View">
        <button class="tab active" data-view="race">Next Race</button>
        <button class="tab" data-view="drivers">Drivers</button>
        <button class="tab" data-view="teams">Teams</button>
    </nav>
    <div id="round" class="round-pill">--</div>
</header>

<div id="main">
    <div id="view-race" class="view active">
        <div id="loading" class="message">Initializing Telemetry...</div>

        <div id="pre-race">
            <div class="race-head">
                <div id="race-name">Loading...</div>
                <div id="race-loc">Loading...</div>
                <div id="race-date"></div>
            </div>

            <div id="track-container">
                <svg id="track-svg" viewBox="14.5 14.5 71 71" preserveAspectRatio="xMidYMid meet">
                    <path id="track-path" d="" />
                </svg>
                <div id="live-box">
                    <div class="live-tag">Race in Progress</div>
                    <div class="lap-count">LAP <span id="cur-lap">1</span>/<span id="tot-lap">--</span></div>
                    <div class="lap-sub">Estimated</div>
                </div>
            </div>

            <div class="timer-row">
                <div class="t-unit"><span class="t-val" id="d">00</span><span class="t-label">Days</span></div>
                <div class="t-unit"><span class="t-val" id="h">00</span><span class="t-label">Hrs</span></div>
                <div class="t-unit"><span class="t-val" id="m">00</span><span class="t-label">Min</span></div>
            </div>
        </div>
    </div>

    <div id="view-standings" class="view">
        <div class="st-head">
            <div class="st-title" id="st-title">Drivers' Championship</div>
            <div class="st-sub" id="st-sub"></div>
        </div>
        <div id="st-list"></div>
    </div>
</div>

<script src="scripts/main.js"></script>
<script>
    icueEvents = {
        onICUEInitialized: start,
        onDataUpdated: applyProps
    };

    // In iCUE the flag is injected before this script runs. Outside iCUE (browser preview) start directly.
    if (typeof iCUE_initialized === 'undefined' || iCUE_initialized) start();
</script>
</body>
</html>
